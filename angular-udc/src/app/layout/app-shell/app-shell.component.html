@if (!auth.isAuthenticated()) {
  <main class="auth-page">
    <section class="auth-carousel" aria-label="Presentación de UDC Deporte Canarias">
      <div class="carousel-track">
        @for (slide of authSlides; track slide.title; let index = $index) {
          <article class="carousel-slide" [class.is-active]="activeSlide() === index">
            <img [src]="slide.image" [alt]="slide.meta" [style.object-position]="slide.position" />
            <div class="carousel-shade"></div>
          </article>
        }
      </div>
    </section>

    <section class="auth-intro" aria-label="UDC Deporte Canarias">
      <div class="auth-copy">
        <h1>Todo el deporte canario,<br />en un solo lugar.</h1>
      </div>
    </section>

    <section class="auth-card">
      <div class="auth-card-header">
        <span class="auth-icon"><i class="bi bi-shield-check"></i></span>
        <div>
          <h2>Acceso</h2>
          <p>Entra con tus credenciales UDC.</p>
        </div>
      </div>

      <form (ngSubmit)="login()" class="d-grid gap-3">
        <label class="form-label-group">
          <span>Usuario</span>
          <input class="form-control form-control-lg" name="username" [(ngModel)]="loginForm.username" required autocomplete="username" />
        </label>

        <label class="form-label-group">
          <span>Contraseña</span>
          <input class="form-control form-control-lg" name="password" type="password" [(ngModel)]="loginForm.password" required autocomplete="current-password" />
        </label>

        @if (auth.loginError()) {
          <div class="alert alert-danger mb-0">{{ auth.loginError() }}</div>
        }

        <button type="submit" class="btn btn-primary btn-lg" [disabled]="auth.loading()">
          @if (auth.loading()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
            Entrando
          } @else {
            Entrar al panel
          }
        </button>
      </form>
    </section>
  </main>
} @else {
  <div class="app-shell">
    <app-sidebar />

    <div class="app-main">
      <app-topbar />
      <main class="app-content">
        <router-outlet />
      </main>
    </div>
  </div>
}
