<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario - UDC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/icons/LOGO SIN LETRAS UDC.png">
  <style>
    #calendar {
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 20px;
    }

    .fc .fc-toolbar-title { font-size: 16px; font-weight: 600; }
    .fc .fc-button { border-radius: 6px !important; font-size: 13px; }
    .fc .fc-button-primary { background: var(--primary) !important; border-color: var(--primary) !important; }
    .fc .fc-button-primary:not(:disabled).fc-button-active,
    .fc .fc-button-primary:not(:disabled):active { background: #1d4ed8 !important; border-color: #1d4ed8 !important; }
    .fc .fc-daygrid-event { border-radius: 4px; font-size: 12px; }
    .fc .fc-col-header-cell { font-size: 12px; font-weight: 600; }

    .calendar-legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="wrapper">
  <div id="sidebar-container"></div>

  <div class="content-wrapper" id="content-wrapper">
    <div id="topbar-container"></div>

    <main class="main-content">

      <!-- Header -->
      <div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div>
          <h1>Calendario</h1>
          <p class="text-muted mb-0">Vista de partidos y asignaciones</p>
        </div>
        <div class="d-flex gap-2 align-items-center flex-wrap">
          <!-- Filtro vista -->
          <select class="form-select form-select-sm" id="filtroCalendario" style="width:auto">
            <option value="todos">Todos los partidos</option>
            <option value="mis-asignaciones">Mis asignaciones</option>
            <option value="pendientes">Pendientes de asignar</option>
          </select>
          <a href="partidos.html" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-list-ul me-1"></i> Ver lista
          </a>
        </div>
      </div>

      <!-- Leyenda + Calendario -->
      <div class="card mb-3">
        <div class="card-body py-2 px-3 border-bottom">
          <div class="calendar-legend">
            <div class="legend-item">
              <div class="legend-dot" style="background:#2563eb"></div> Programado
            </div>
            <div class="legend-item">
              <div class="legend-dot" style="background:#16a34a"></div> En curso
            </div>
            <div class="legend-item">
              <div class="legend-dot" style="background:#64748b"></div> Finalizado
            </div>
            <div class="legend-item">
              <div class="legend-dot" style="background:#d97706"></div> Pendiente asignación
            </div>
            <div class="legend-item">
              <div class="legend-dot" style="background:#dc2626"></div> Cancelado
            </div>
          </div>
        </div>
        <div class="card-body">
          <div id="calendar"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Popover detalle de partido -->
<div class="modal fade" id="modalDetallePartido" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header border-0 pb-1">
        <h6 class="modal-title" id="detallePartidoTitle">Partido</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pt-0" id="detallePartidoBody">
      </div>
      <div class="modal-footer border-0 pt-0">
        <a href="partidos.html" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Ver partidos</a>
        <a href="asignaciones.html" class="btn btn-sm btn-primary" data-bs-dismiss="modal" id="detalleAsignarBtn">Asignar árbitro</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/calendario.js"></script>
</body>
</html>
