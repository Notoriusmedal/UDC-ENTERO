<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Árbitros - UDC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/icons/LOGO SIN LETRAS UDC.png">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="wrapper">
  <div id="sidebar-container"></div>

  <div class="content-wrapper" id="content-wrapper">
    <div id="topbar-container"></div>

    <main class="main-content">

      <!-- Header -->
      <div class="page-header d-flex justify-content-between align-items-start">
        <div>
          <h1>Árbitros</h1>
          <p class="text-muted mb-0">Gestión de árbitros y equipos arbitrales</p>
        </div>
        <button class="btn btn-primary d-none" id="btnNuevoArbitro" data-bs-toggle="modal" data-bs-target="#modalArbitro">
          <i class="bi bi-person-plus me-1"></i> Nuevo árbitro
        </button>
      </div>

      <!-- Filtros -->
      <div class="filter-bar">
        <div>
          <label class="form-label mb-1">Buscar</label>
          <input type="text" class="form-control" id="filtroTexto" placeholder="Nombre, DNI..." style="min-width:200px">
        </div>
        <div>
          <label class="form-label mb-1">Disponibilidad</label>
          <select class="form-select" id="filtroDisponibilidad" style="min-width:150px">
            <option value="">Todos</option>
            <option value="DISPONIBLE">Disponible</option>
            <option value="NO_DISPONIBLE">No disponible</option>
          </select>
        </div>
        <div>
          <label class="form-label mb-1">Categoría</label>
          <select class="form-select" id="filtroCategoria" style="min-width:150px">
            <option value="">Todas</option>
            <option value="NACIONAL">Nacional</option>
            <option value="REGIONAL">Regional</option>
            <option value="PROVINCIAL">Provincial</option>
            <option value="LOCAL">Local</option>
          </select>
        </div>
        <div class="ms-auto d-flex gap-2 align-items-end">
          <button class="btn btn-outline-secondary" id="btnLimpiarFiltros">
            <i class="bi bi-x-circle me-1"></i> Limpiar
          </button>
          <button class="btn btn-primary" id="btnBuscar">
            <i class="bi bi-search me-1"></i> Buscar
          </button>
        </div>
      </div>

      <!-- Tabla -->
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="bi bi-person-badge me-2"></i>Lista de árbitros</span>
          <span class="text-muted" style="font-size:12px" id="totalArbitrosLabel"></span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table mb-0">
              <thead>
                <tr>
                  <th>Árbitro</th>
                  <th>Contacto</th>
                  <th>Categoría</th>
                  <th>Competencias</th>
                  <th>Partidos</th>
                  <th>Disponibilidad</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="arbitrosList">
                <tr>
                  <td colspan="7" class="text-center py-4">
                    <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-body border-top py-2 d-flex justify-content-between align-items-center">
          <span class="text-muted" style="font-size:12px" id="paginacionInfo"></span>
          <nav>
            <ul class="pagination pagination-sm mb-0" id="paginacion"></ul>
          </nav>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Modal Crear/Editar Árbitro -->
<div class="modal fade" id="modalArbitro" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalArbitroTitle">Nuevo árbitro</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formArbitro" novalidate>
          <input type="hidden" id="arbitroId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nombre <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="arbitroNombre" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Apellidos <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="arbitroApellidos" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">DNI / NIE</label>
              <input type="text" class="form-control" id="arbitroDni">
            </div>
            <div class="col-md-4">
              <label class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="arbitroTelefono">
            </div>
            <div class="col-md-4">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="arbitroEmail">
            </div>
            <div class="col-md-4">
              <label class="form-label">Categoría</label>
              <select class="form-select" id="arbitroCategoria">
                <option value="LOCAL">Local</option>
                <option value="PROVINCIAL">Provincial</option>
                <option value="REGIONAL">Regional</option>
                <option value="NACIONAL">Nacional</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Licencia</label>
              <input type="text" class="form-control" id="arbitroLicencia" placeholder="Nº de licencia">
            </div>
            <div class="col-md-4">
              <label class="form-label">Disponibilidad</label>
              <select class="form-select" id="arbitroDisponibilidad">
                <option value="DISPONIBLE">Disponible</option>
                <option value="NO_DISPONIBLE">No disponible</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Competencias / Deportes</label>
              <div class="d-flex flex-wrap gap-2" id="competenciasCheck">
                <div class="form-check"><input class="form-check-input" type="checkbox" value="FUTBOL" id="compFutbol"><label class="form-check-label" for="compFutbol">Fútbol</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="BALONCESTO" id="compBaloncesto"><label class="form-check-label" for="compBaloncesto">Baloncesto</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="VOLEIBOL" id="compVoleibol"><label class="form-check-label" for="compVoleibol">Voleibol</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="BALONMANO" id="compBalonmano"><label class="form-check-label" for="compBalonmano">Balonmano</label></div>
              </div>
            </div>
            <div class="col-12">
              <label class="form-label">Observaciones</label>
              <textarea class="form-control" id="arbitroObservaciones" rows="2"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnGuardarArbitro">
          <span id="btnGuardarArbitroText">Guardar</span>
          <span id="btnGuardarArbitroSpinner" class="spinner-border spinner-border-sm ms-1 d-none"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Confirmar Eliminar -->
<div class="modal fade" id="modalEliminarArbitro" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h6 class="modal-title">Eliminar árbitro</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0" style="font-size:14px">¿Seguro que quieres eliminar este árbitro?</p>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-sm btn-danger" id="btnConfirmarEliminarArbitro">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/arbitros.js"></script>
</body>
</html>
