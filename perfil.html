<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil - UDC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/icons/LOGO SIN LETRAS UDC.png">
  <script src="js/theme.js"></script>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="wrapper">
  <div id="sidebar-container"></div>

  <div class="content-wrapper" id="content-wrapper">
    <div id="topbar-container"></div>

    <main class="main-content">

      <div class="page-header d-flex justify-content-between align-items-start">
        <div>
          <h1>Mi perfil</h1>
          <p class="text-muted mb-0">Datos de tu cuenta y sesión actual</p>
        </div>
        <button class="btn btn-outline-secondary" id="btnRecargarPerfil">
          <i class="bi bi-arrow-clockwise me-1"></i> Recargar
        </button>
      </div>

      <div class="row g-3">
        <div class="col-lg-4">
          <div class="card h-100">
            <div class="card-body text-center">
              <div id="perfilAvatar" class="mx-auto mb-3"></div>
              <h2 class="perfil-name" id="perfilNombre">—</h2>
              <div id="perfilRol" class="mb-3"></div>
              <div class="d-grid gap-2">
                <a href="dashboard.html" class="btn btn-primary">
                  <i class="bi bi-speedometer2 me-1"></i> Ir al dashboard
                </a>
                <button type="button" class="btn btn-outline-danger" id="btnCerrarSesionPerfil">
                  <i class="bi bi-box-arrow-left me-1"></i> Cerrar sesión
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card h-100">
            <div class="card-header">
              <i class="bi bi-person-lines-fill me-2"></i>Información de la cuenta
            </div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="profile-field">
                    <span>Usuario</span>
                    <strong id="perfilUsername">—</strong>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="profile-field">
                    <span>Correo</span>
                    <strong id="perfilCorreo">—</strong>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="profile-field">
                    <span>Nombre</span>
                    <strong id="perfilNombreDetalle">—</strong>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="profile-field">
                    <span>Apellidos</span>
                    <strong id="perfilApellidos">—</strong>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="profile-field">
                    <span>Rol interno</span>
                    <strong id="perfilRolInterno">—</strong>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="profile-field">
                    <span>ID de usuario</span>
                    <strong id="perfilId">—</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card mt-3">
        <div class="card-header">
          <i class="bi bi-shield-check me-2"></i>Acceso
        </div>
        <div class="card-body">
          <div class="row g-3" id="perfilAccesos"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
