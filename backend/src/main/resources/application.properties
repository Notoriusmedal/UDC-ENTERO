spring.application.name=udc

# Perfil principal: datos persistentes en MariaDB (ver database/dbeaver-init-udc-mariadb.sql)
# Para desarrollo rapido sin MariaDB: spring.profiles.active=dev
spring.profiles.active=mariadb

# JWT firma HS256 / caducidad (no subir jwt.secret real en repos publicos)
jwt.secret=DEV-ONLY-cambiar-en-produccion-clave-minimo-32-bytes-en-UTF8-xxxxxxxx
jwt.expiration=28800000

cors.allowed-origin=http://localhost:4200
cors.extra-allowed-origins=http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500

# Distancia (km) entre instalaciones en el mismo dia calendario para avisar al coordinador (si hay lat/lon)
udc.business.kilometros-aviso-lejania-mismo-dia=60
