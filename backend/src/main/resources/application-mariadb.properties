# Perfil mariadb: datos persistentes en MariaDB
# 1) Ejecuta en DBeaver (como root o admin): database/dbeaver-init-udc-mariadb.sql
# 2) Si cambias la clave SQL, igualala en spring.datasource.password de abajo

spring.datasource.url=jdbc:mariadb://localhost:3306/udc?characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=udc
spring.datasource.password=cambiar
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.h2.console.enabled=false

# Si la tabla usuario esta vacia al arrancar, crea ADMIN de prueba con las credenciales de abajo
udc.bootstrap.dev-users=true
udc.bootstrap.admin.username=admin
udc.bootstrap.admin.password=admin
