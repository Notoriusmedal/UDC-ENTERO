# Base en memoria para desarrollo sin MariaDB
spring.datasource.url=jdbc:h2:mem:udc;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Usuario inicial (solo desarrollo): POST /api/auth/login con estos datos
udc.bootstrap.dev-users=true
udc.bootstrap.admin.username=admin
udc.bootstrap.admin.password=admin
