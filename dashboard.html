<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - UDC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="wrapper">
  <div id="sidebar-container"></div>

  <div class="content-wrapper" id="content-wrapper">
    <div id="topbar-container"></div>

    <main class="main-content">

      <!-- Header -->
      <div class="page-header d-flex justify-content-between align-items-start">
        <div>
          <h1 id="welcomeTitle">Bienvenido</h1>
          <p class="text-muted mb-0">Resumen general de la plataforma</p>
        </div>
        <span class="text-muted" style="font-size:13px" id="currentDate"></span>
      </div>

      <!-- Stats -->
      <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon icon-blue"><i class="bi bi-trophy"></i></div>
            <div class="stat-value" id="statPartidos">—</div>
            <div class="stat-label">Partidos esta semana</div>
            <div class="stat-change up" id="statPartidosCambio"><i class="bi bi-arrow-up-short"></i> —</div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon icon-green"><i class="bi bi-person-badge"></i></div>
            <div class="stat-value" id="statArbitros">—</div>
            <div class="stat-label">Árbitros disponibles</div>
            <div class="stat-change up" id="statArbitrosCambio"><i class="bi bi-arrow-up-short"></i> —</div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon icon-yellow"><i class="bi bi-calendar-check"></i></div>
            <div class="stat-value" id="statAsignaciones">—</div>
            <div class="stat-label">Asignaciones pendientes</div>
            <div class="stat-change down" id="statAsignacionesCambio"><i class="bi bi-arrow-down-short"></i> —</div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon icon-red"><i class="bi bi-exclamation-triangle"></i></div>
            <div class="stat-value" id="statConflictos">—</div>
            <div class="stat-label">Conflictos activos</div>
            <div class="stat-change" id="statConflictosCambio">—</div>
          </div>
        </div>
      </div>

      <!-- Content Grid -->
      <div class="row g-4">

        <!-- Próximos partidos -->
        <div class="col-lg-8">
          <div class="card h-100">
            <div class="card-header d-flex justify-content-between align-items-center">
              <span><i class="bi bi-trophy me-2 text-primary"></i>Próximos partidos</span>
              <a href="partidos.html" class="btn btn-sm btn-outline-primary">Ver todos</a>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table mb-0">
                  <thead>
                    <tr>
                      <th>Partido</th>
                      <th>Fecha</th>
                      <th>Árbitros</th>
                      <th>Estado</th>
                    </tr>
                  </thead>
                  <tbody id="proximosPartidosList">
                    <tr>
                      <td colspan="4" class="text-center py-4">
                        <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- Panel derecho -->
        <div class="col-lg-4 d-flex flex-column gap-4">

          <!-- Asignaciones pendientes -->
          <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <span><i class="bi bi-clock me-2 text-warning"></i>Pendientes de asignar</span>
              <a href="asignaciones.html" class="btn btn-sm btn-outline-secondary">Ver</a>
            </div>
            <div class="card-body" id="pendientesList">
              <div class="text-center py-3">
                <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
              </div>
            </div>
          </div>

          <!-- Acceso rápido por rol -->
          <div class="card" id="quickActionsCard">
            <div class="card-header">
              <i class="bi bi-lightning me-2 text-warning"></i>Acciones rápidas
            </div>
            <div class="card-body d-grid gap-2" id="quickActionsList">
              <!-- Rellena dashboard.js según el rol -->
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
