services:
  backend:
    build:
      context: ./backend
    container_name: udc-backend-demo
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGIN: http://localhost:4200
      CORS_EXTRA_ALLOWED_ORIGINS: http://127.0.0.1:4200
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./angular-udc
    container_name: udc-frontend-demo
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
