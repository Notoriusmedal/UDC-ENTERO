<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partidos - UDC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/icons/LOGO SIN LETRAS UDC.png">
  <script src="js/theme.js"></script>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="wrapper">
  <div id="sidebar-container"></div>

  <div class="content-wrapper" id="content-wrapper">
    <div id="topbar-container"></div>

    <main class="main-content">

      <!-- Header -->
      <div class="page-header d-flex justify-content-between align-items-start">
        <div>
          <h1>Partidos</h1>
          <p class="text-muted mb-0">Gestión de partidos y encuentros</p>
        </div>
        <button class="btn btn-primary d-none" id="btnNuevoPartido" data-bs-toggle="modal" data-bs-target="#modalPartido">
          <i class="bi bi-plus-lg me-1"></i> Nuevo partido
        </button>
      </div>

      <!-- Filtros -->
      <div class="filter-bar">
        <div>
          <label class="form-label mb-1">Buscar</label>
          <input type="text" class="form-control" id="filtroTexto" placeholder="Equipo local, visitante..." style="min-width:200px">
        </div>
        <div>
          <label class="form-label mb-1">Estado</label>
          <select class="form-select" id="filtroEstado" style="min-width:150px">
            <option value="">Todos</option>
            <option value="PROGRAMADO">Programado</option>
            <option value="EN_CURSO">En curso</option>
            <option value="FINALIZADO">Finalizado</option>
            <option value="CANCELADO">Cancelado</option>
          </select>
        </div>
        <div>
          <label class="form-label mb-1">Desde</label>
          <input type="date" class="form-control" id="filtroDesde">
        </div>
        <div>
          <label class="form-label mb-1">Hasta</label>
          <input type="date" class="form-control" id="filtroHasta">
        </div>
        <div class="ms-auto d-flex gap-2 align-items-end">
          <button class="btn btn-outline-secondary" id="btnLimpiarFiltros">
            <i class="bi bi-x-circle me-1"></i> Limpiar
          </button>
          <button class="btn btn-primary" id="btnBuscar">
            <i class="bi bi-search me-1"></i> Buscar
          </button>
        </div>
      </div>

      <!-- Tabla -->
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="bi bi-list-ul me-2"></i>Lista de partidos</span>
          <span class="text-muted" style="font-size:12px" id="totalPartidosLabel"></span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table mb-0">
              <thead>
                <tr>
                  <th>Partido</th>
                  <th>Fecha y hora</th>
                  <th>Lugar</th>
                  <th>Deporte</th>
                  <th>Árbitros</th>
                  <th>Estado</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="partidosList">
                <tr>
                  <td colspan="7" class="text-center py-4">
                    <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <!-- Paginación -->
        <div class="card-body border-top py-2 d-flex justify-content-between align-items-center" id="paginacionContainer">
          <span class="text-muted" style="font-size:12px" id="paginacionInfo"></span>
          <nav>
            <ul class="pagination pagination-sm mb-0" id="paginacion"></ul>
          </nav>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Modal Crear/Editar Partido -->
<div class="modal fade" id="modalPartido" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalPartidoTitle">Nuevo partido</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formPartido" novalidate>
          <input type="hidden" id="partidoId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Equipo local <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="equipoLocal" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Equipo visitante <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="equipoVisitante" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Fecha <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="partidoFecha" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Hora <span class="text-danger">*</span></label>
              <input type="time" class="form-control" id="partidoHora" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Deporte</label>
              <select class="form-select" id="partidoDeporte">
                <option value="FUTBOL">Fútbol</option>
                <option value="BALONCESTO">Baloncesto</option>
                <option value="VOLEIBOL">Voleibol</option>
                <option value="BALONMANO">Balonmano</option>
                <option value="OTRO">Otro</option>
              </select>
            </div>
            <div class="col-md-8">
              <label class="form-label">Lugar / Instalación</label>
              <input type="text" class="form-control" id="partidoLugar" placeholder="Ej: Estadio Municipal Norte">
            </div>
            <div class="col-md-4">
              <label class="form-label">Competición</label>
              <input type="text" class="form-control" id="partidoCompeticion" placeholder="Ej: Liga Regional">
            </div>
            <div class="col-12">
              <label class="form-label">Observaciones</label>
              <textarea class="form-control" id="partidoObservaciones" rows="2"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnGuardarPartido">
          <span id="btnGuardarPartidoText">Guardar</span>
          <span id="btnGuardarPartidoSpinner" class="spinner-border spinner-border-sm ms-1 d-none"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Confirmar Eliminar -->
<div class="modal fade" id="modalEliminarPartido" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h6 class="modal-title">Eliminar partido</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0" style="font-size:14px">¿Seguro que quieres eliminar este partido? Esta acción no se puede deshacer.</p>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-sm btn-danger" id="btnConfirmarEliminarPartido">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/partidos.js"></script>
</body>
</html>
