<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asignaciones - UDC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/icons/LOGO SIN LETRAS UDC.png">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="wrapper">
  <div id="sidebar-container"></div>

  <div class="content-wrapper" id="content-wrapper">
    <div id="topbar-container"></div>

    <main class="main-content">

      <!-- Header -->
      <div class="page-header d-flex justify-content-between align-items-start">
        <div>
          <h1>Asignaciones</h1>
          <p class="text-muted mb-0">Asignación de árbitros a partidos</p>
        </div>
        <button class="btn btn-primary d-none" id="btnNuevaAsignacion" data-bs-toggle="modal" data-bs-target="#modalAsignacion">
          <i class="bi bi-plus-lg me-1"></i> Nueva asignación
        </button>
      </div>

      <!-- Filtros -->
      <div class="filter-bar">
        <div>
          <label class="form-label mb-1">Estado</label>
          <select class="form-select" id="filtroEstado" style="min-width:150px">
            <option value="">Todos</option>
            <option value="PENDIENTE">Pendiente</option>
            <option value="CONFIRMADO">Confirmado</option>
            <option value="RECHAZADO">Rechazado</option>
          </select>
        </div>
        <div>
          <label class="form-label mb-1">Desde</label>
          <input type="date" class="form-control" id="filtroDesde">
        </div>
        <div>
          <label class="form-label mb-1">Hasta</label>
          <input type="date" class="form-control" id="filtroHasta">
        </div>
        <div class="ms-auto d-flex gap-2 align-items-end">
          <button class="btn btn-outline-secondary" id="btnLimpiarFiltros">
            <i class="bi bi-x-circle me-1"></i> Limpiar
          </button>
          <button class="btn btn-primary" id="btnBuscar">
            <i class="bi bi-search me-1"></i> Buscar
          </button>
        </div>
      </div>

      <!-- Tabla -->
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="bi bi-calendar-check me-2"></i>Lista de asignaciones</span>
          <span class="text-muted" style="font-size:12px" id="totalAsignacionesLabel"></span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table mb-0">
              <thead>
                <tr>
                  <th>Partido</th>
                  <th>Fecha</th>
                  <th>Árbitro</th>
                  <th>Rol en el partido</th>
                  <th>Asignado por</th>
                  <th>Estado</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="asignacionesList">
                <tr>
                  <td colspan="7" class="text-center py-4">
                    <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-body border-top py-2 d-flex justify-content-between align-items-center">
          <span class="text-muted" style="font-size:12px" id="paginacionInfo"></span>
          <nav>
            <ul class="pagination pagination-sm mb-0" id="paginacion"></ul>
          </nav>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Modal Nueva Asignación -->
<div class="modal fade" id="modalAsignacion" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalAsignacionTitle">Nueva asignación</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formAsignacion" novalidate>
          <input type="hidden" id="asignacionId">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Partido <span class="text-danger">*</span></label>
              <select class="form-select" id="asignacionPartido" required>
                <option value="">Selecciona un partido...</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Árbitro <span class="text-danger">*</span></label>
              <select class="form-select" id="asignacionArbitro" required>
                <option value="">Selecciona un árbitro...</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Rol en el partido</label>
              <select class="form-select" id="asignacionRol">
                <option value="PRINCIPAL">Principal</option>
                <option value="ASISTENTE_1">Asistente 1</option>
                <option value="ASISTENTE_2">Asistente 2</option>
                <option value="CUARTO">Cuarto árbitro</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Observaciones</label>
              <textarea class="form-control" id="asignacionObservaciones" rows="2"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnGuardarAsignacion">
          <span id="btnGuardarAsignacionText">Asignar</span>
          <span id="btnGuardarAsignacionSpinner" class="spinner-border spinner-border-sm ms-1 d-none"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Confirmar / Rechazar (árbitro) -->
<div class="modal fade" id="modalResponderAsignacion" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h6 class="modal-title" id="modalResponderTitle">Confirmar asignación</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0" style="font-size:14px" id="modalResponderMsg">¿Confirmas que puedes asistir a este partido?</p>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-sm btn-danger" id="btnRechazarAsignacion">Rechazar</button>
        <button type="button" class="btn btn-sm btn-success" id="btnConfirmarAsignacion">Confirmar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/asignaciones.js"></script>
</body>
</html>
