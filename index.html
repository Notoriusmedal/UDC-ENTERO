<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Union Deporte Canaria - UDC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/icons/LOGO SIN LETRAS UDC.png">
</head>
<body class="login-video-page">

  <!-- Vídeo de fondo -->
  <div class="login-video-wrap">
    <video autoplay muted loop playsinline id="bgVideo">
      <source src="assets/videos/bg.mp4" type="video/mp4">
      <source src="assets/videos/bg.webm" type="video/webm">
    </video>
    <div class="login-video-overlay"></div>
  </div>

  <!-- Card de login -->
  <div class="login-video-container">
    <div class="login-card">

      <div class="login-logo">
        <img src="assets/icons/LOGO SIN LETRAS UDC.png" alt="UDC" class="login-logo-img"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <i class="bi bi-trophy-fill" style="display:none"></i>
      </div>

      <h1 class="login-title">Union Deporte Canaria</h1>
      <p class="login-subtitle">Gestión de árbitros y partidos</p>

      <div id="loginAlert" class="alert alert-danger d-none py-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span id="loginAlertMsg">Credenciales incorrectas.</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-person text-secondary"></i></span>
            <input type="text" class="form-control" id="username"
                   placeholder="Introduce tu usuario" required autocomplete="username">
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-lock text-secondary"></i></span>
            <input type="password" class="form-control" id="password"
                   placeholder="Introduce tu contraseña" required autocomplete="current-password">
            <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">
          <span id="loginBtnText">Iniciar sesión</span>
          <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
        </button>
      </form>

      <hr class="my-3">
      <p class="text-center mb-0" style="font-size: 12px; color: #94a3b8;">
        Union Deporte Canaria &copy; 2025
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
