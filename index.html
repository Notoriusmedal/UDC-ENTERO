<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Union Deporte Canaria - UDC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/icons/LOGO SIN LETRAS UDC.png">
</head>
<body class="landing-body">

  <!-- Fondo de vídeo -->
  <div class="landing-video-wrap">
    <video autoplay muted loop playsinline id="bgVideo">
      <source src="assets/videos/bg.mp4" type="video/mp4">
      <source src="assets/videos/bg.webm" type="video/webm">
    </video>
    <div class="landing-overlay"></div>
  </div>

  <!-- Contenido principal -->
  <div class="landing-container">

    <!-- Branding -->
    <div class="landing-brand" id="landingBrand">
      <div class="landing-logo-icon">
        <img src="assets/icons/LOGO SIN LETRAS UDC.png" alt="UDC" class="landing-logo-img"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <i class="bi bi-trophy-fill" style="display:none"></i>
      </div>
      <div>
        <h1 class="landing-title">Union Deporte Canaria</h1>
        <p class="landing-tagline">Plataforma de gestión arbitral · Tenerife</p>
      </div>
    </div>

    <!-- Selección de deporte -->
    <div class="landing-section" id="landingSection">
      <p class="landing-section-label">¿Qué deporte quieres ver hoy?</p>
      <div class="sports-grid" id="sportsGrid">

        <button class="sport-card" data-deporte="TODOS">
          <span class="sport-emoji">🏟️</span>
          <span class="sport-name">Todos</span>
        </button>

        <button class="sport-card" data-deporte="FUTBOL">
          <span class="sport-emoji">⚽</span>
          <span class="sport-name">Fútbol</span>
        </button>

        <button class="sport-card" data-deporte="BALONCESTO">
          <span class="sport-emoji">🏀</span>
          <span class="sport-name">Baloncesto</span>
        </button>

        <button class="sport-card" data-deporte="VOLEIBOL">
          <span class="sport-emoji">🏐</span>
          <span class="sport-name">Voleibol</span>
        </button>

        <button class="sport-card" data-deporte="BALONMANO">
          <span class="sport-emoji">🤾</span>
          <span class="sport-name">Balonmano</span>
        </button>

      </div>
    </div>

    <!-- Botón acceder -->
    <a href="login.html" class="btn-landing-enter" id="btnEntrar">
      Acceder a la plataforma
      <i class="bi bi-arrow-right ms-2"></i>
    </a>

    <!-- Deporte seleccionado (aparece bajo el botón) -->
    <p class="landing-selected-label" id="selectedLabel"></p>

  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
