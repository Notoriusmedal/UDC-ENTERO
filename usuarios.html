<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios - UDC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/icons/LOGO SIN LETRAS UDC.png">
  <script src="js/theme.js"></script>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="wrapper">
  <div id="sidebar-container"></div>

  <div class="content-wrapper" id="content-wrapper">
    <div id="topbar-container"></div>

    <main class="main-content">

      <div class="page-header d-flex justify-content-between align-items-start">
        <div>
          <h1>Usuarios</h1>
          <p class="text-muted mb-0">Gestión de cuentas, roles y acceso</p>
        </div>
        <button class="btn btn-primary" id="btnNuevoUsuario" data-bs-toggle="modal" data-bs-target="#modalUsuario">
          <i class="bi bi-person-plus me-1"></i> Nuevo usuario
        </button>
      </div>

      <div class="filter-bar">
        <div>
          <label class="form-label mb-1">Buscar</label>
          <input type="text" class="form-control" id="filtroTexto" placeholder="Usuario, nombre, email..." style="min-width:220px">
        </div>
        <div>
          <label class="form-label mb-1">Rol</label>
          <select class="form-select" id="filtroRol" style="min-width:170px">
            <option value="">Todos</option>
            <option value="ADMIN">Administrador</option>
            <option value="COORDINADOR_ARBITROS">Coordinador</option>
            <option value="ORGANIZADOR">Organizador</option>
            <option value="ARBITRO">Árbitro</option>
          </select>
        </div>
        <div>
          <label class="form-label mb-1">Estado</label>
          <select class="form-select" id="filtroEstado" style="min-width:140px">
            <option value="">Todos</option>
            <option value="ACTIVO">Activo</option>
            <option value="INACTIVO">Inactivo</option>
          </select>
        </div>
        <div class="ms-auto d-flex gap-2 align-items-end">
          <button class="btn btn-outline-secondary" id="btnLimpiarFiltros">
            <i class="bi bi-x-circle me-1"></i> Limpiar
          </button>
          <button class="btn btn-primary" id="btnBuscar">
            <i class="bi bi-search me-1"></i> Buscar
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="bi bi-people me-2"></i>Lista de usuarios</span>
          <span class="text-muted" style="font-size:12px" id="totalUsuariosLabel"></span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table mb-0">
              <thead>
                <tr>
                  <th>Usuario</th>
                  <th>Contacto</th>
                  <th>Rol</th>
                  <th>Estado</th>
                  <th>Convocable</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="usuariosList">
                <tr>
                  <td colspan="6" class="text-center py-4">
                    <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-body border-top py-2 d-flex justify-content-between align-items-center">
          <span class="text-muted" style="font-size:12px" id="paginacionInfo"></span>
          <nav>
            <ul class="pagination pagination-sm mb-0" id="paginacion"></ul>
          </nav>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="modal fade" id="modalUsuario" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalUsuarioTitle">Nuevo usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formUsuario" novalidate>
          <input type="hidden" id="usuarioId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Usuario <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="usuarioUsername" maxlength="64" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Contraseña <span class="text-danger" id="passwordRequiredMark">*</span></label>
              <input type="password" class="form-control" id="usuarioPassword" minlength="6" maxlength="120" autocomplete="new-password">
              <div class="form-text" id="passwordHelp">Mínimo 6 caracteres.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Nombre <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="usuarioNombre" maxlength="120" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Apellidos <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="usuarioApellidos" maxlength="120" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="usuarioCorreo" maxlength="180" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">DNI / NIE <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="usuarioDocumento" maxlength="32" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Teléfono <span class="text-danger">*</span></label>
              <input type="tel" class="form-control" id="usuarioTelefono" maxlength="40" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Rol <span class="text-danger">*</span></label>
              <select class="form-select" id="usuarioRol" required>
                <option value="ADMIN">Administrador</option>
                <option value="COORDINADOR_ARBITROS">Coordinador</option>
                <option value="ORGANIZADOR">Organizador</option>
                <option value="ARBITRO">Árbitro</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Estado</label>
              <select class="form-select" id="usuarioEnabled">
                <option value="true">Activo</option>
                <option value="false">Inactivo</option>
              </select>
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="usuarioConvocable">
                <label class="form-check-label" for="usuarioConvocable">Convocable</label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnGuardarUsuario">
          <span id="btnGuardarUsuarioText">Guardar</span>
          <span id="btnGuardarUsuarioSpinner" class="spinner-border spinner-border-sm ms-1 d-none"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/usuarios.js"></script>
</body>
</html>
